---

- name: Prepare
  hosts: all
  gather_facts: false
  become: false

  tasks:
    - name: Ensure /tmp exists (raw)
      ansible.builtin.raw: >
        bash -lc 'mkdir -p /tmp && chmod 0777 /tmp'
      changed_when: false

    # python39: used only as a fallback for older EL images whose default
    # python3 predates ansible-core's minimum. Installing it unconditionally
    # (and symlinking python3 to it) previously broke Fedora 41/42's dnf5
    # module, which needs libdnf5 bindings built against the system's actual
    # default python3 (3.13), not python3.9.
    - name: Install Python 3 (raw, cross-platform)
      ansible.builtin.raw: >
        bash -lc '
        if command -v dnf >/dev/null 2>&1; then
          dnf -y install python3 || dnf -y install python39;
        elif command -v yum >/dev/null 2>&1; then
          yum -y install python3 || yum -y install python36;
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y && apt-get install -y python3;
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3;
        fi'
      changed_when: true

    - name: Reset connection to use installed Python
      ansible.builtin.meta: reset_connection

    - name: Gather facts
      ansible.builtin.setup:

    # python3-apt/gnupg: required by the role's ansible.builtin.apt_key and
    # ansible.builtin.apt_repository tasks (tasks/setup-Debian.yml) — not
    # covered by the generic Python 3 bootstrap above.
    - name: Install python3-apt and GPG tools (Debian/Ubuntu)
      ansible.builtin.raw: >
        bash -lc '
        export DEBIAN_FRONTEND=noninteractive;
        apt-get update -y;
        apt-get install -y python3-apt gnupg ca-certificates'
      when: ansible_facts['os_family'] == 'Debian'
      changed_when: true
