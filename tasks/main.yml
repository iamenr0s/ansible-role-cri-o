---
# tasks file for ansible-role-cri-o

- name: Include tasks for RedHat OS family
  ansible.builtin.include_tasks: setup-RedHat.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags: crio

- name: Include tasks for Debian OS family
  ansible.builtin.include_tasks: setup-Debian.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: crio

- name: Ensure /etc/crio/crio.conf.d exists
  ansible.builtin.file:
    path: "/etc/crio/crio.conf.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: crio

- name: Install crun (Fedora dnf5)
  ansible.builtin.dnf5:
    name: "crun"
    state: "{{ crio_package_state }}"
  when:
    - crio_runtime == 'crun'
    - ansible_facts['distribution'] == 'Fedora'
    - (ansible_facts['distribution_major_version'] | int) >= 41
  tags: crio

- name: Install crun (RedHat dnf)
  ansible.builtin.dnf:
    name: "crun"
    state: "{{ crio_package_state }}"
  when:
    - crio_runtime == 'crun'
    - ansible_facts['os_family'] == 'RedHat'
    - not (ansible_facts['distribution'] == 'Fedora' and (ansible_facts['distribution_major_version'] | int) >= 41)
  tags: crio

- name: Install crun (Debian)
  ansible.builtin.apt:
    name: "crun"
    state: "{{ crio_package_state }}"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - crio_runtime == 'crun'
  tags: crio

- name: Configure CRI-O to use crun
  ansible.builtin.copy:
    src: "crun.conf"
    dest: "/etc/crio/crio.conf.d/99-crun.conf"
    owner: root
    group: root
    mode: "0644"
  when: crio_runtime == 'crun'
  tags: crio

- name: Install containers-common (Fedora dnf5)
  ansible.builtin.dnf5:
    name: "containers-common"
    state: "{{ crio_package_state }}"
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - (ansible_facts['distribution_major_version'] | int) >= 41
  tags: crio

- name: Install containers-common (RedHat dnf)
  ansible.builtin.dnf:
    name: "containers-common"
    state: "{{ crio_package_state }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not (ansible_facts['distribution'] == 'Fedora' and (ansible_facts['distribution_major_version'] | int) >= 41)
  tags: crio

- name: Ensure /etc/systemd/system/crio.service.d exists
  ansible.builtin.file:
    path: "/etc/systemd/system/crio.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: crio_systemd_slice != 'system.slice'
  tags: crio

- name: Set the systemd slice of the CRI-O service
  ansible.builtin.template:
    src: "crio-slice.conf.j2"
    dest: "/etc/systemd/system/crio.service.d/slice.conf"
    owner: root
    group: root
    mode: "0644"
  when: crio_systemd_slice != 'system.slice'
  tags: crio

- name: Add extra CRI-O configuration to /etc/crio/crio.conf.d
  ansible.builtin.copy:
    content: "{{ crio_extra_config }}"
    dest: "/etc/crio/crio.conf.d/99-extra.conf"
    owner: root
    group: root
    mode: "0644"
  when: (crio_extra_config | default('')) | length > 0
  tags: crio

- name: Ensure CRI-O is installed (Fedora dnf5)
  ansible.builtin.dnf5:
    name: "{{ crio_package }}"
    state: "{{ crio_package_state }}"
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - (ansible_facts['distribution_major_version'] | int) >= 41
  tags: crio

- name: Ensure CRI-O is installed (RedHat dnf)
  ansible.builtin.dnf:
    name: "{{ crio_package }}"
    state: "{{ crio_package_state }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not (ansible_facts['distribution'] == 'Fedora' and (ansible_facts['distribution_major_version'] | int) >= 41)
  tags: crio

- name: Ensure CRI-O is installed (Debian)
  ansible.builtin.apt:
    name: "{{ crio_package }}"
    state: "{{ crio_package_state }}"
  when: ansible_facts['os_family'] == 'Debian'
  tags: crio

- name: Ensure CRI-O is started and enabled at boot (RedHat)
  ansible.builtin.service:
    name: crio
    state: "{{ crio_service_state }}"
    enabled: "{{ crio_service_enabled }}"
  when: >-
    ansible_facts['os_family'] == 'RedHat' and
    (crio_service_state == 'started' or (crio_service_enabled | bool))
  tags: crio

- name: Ensure CRI-O is started and enabled at boot (Debian)
  ansible.builtin.service:
    name: crio
    state: "{{ crio_service_state }}"
    enabled: "{{ crio_service_enabled }}"
  when: >-
    ansible_facts['os_family'] == 'Debian' and
    (crio_service_state == 'started' or (crio_service_enabled | bool))
  tags: crio
