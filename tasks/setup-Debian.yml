---
# tasks file for Debian/Ubuntu setup

- name: setup-Debian | Download CRI-O APT repository GPG key
  ansible.builtin.get_url:
    url: "{{ crio_apt_key_url }}"
    dest: "/tmp/crio-obs.asc"
    mode: "0644"
  tags: crio

# apt-key is removed in Debian 13+ (deprecated since bullseye); dearmoring
# into a signed-by keyring is the modern, distro-agnostic replacement.
- name: setup-Debian | Dearmor CRI-O APT repository GPG key
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o /usr/share/keyrings/crio-obs.gpg /tmp/crio-obs.asc"
  args:
    creates: "/usr/share/keyrings/crio-obs.gpg"
  tags: crio

- name: setup-Debian | Add CRI-O APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/crio-obs.gpg] {{ crio_apt_repository }} /"
    filename: "cri-o"
    state: present
  tags: crio

- name: setup-Debian | Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: crio
